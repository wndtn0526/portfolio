<text x="633.0" y="612.2" font-size="12" font-weight="400" fill="#868e96" text-anchor="start" letter-spacing="-0.24">시스템을 일상 업무에 정착시켜 활용 빈도가 높아짐. ERP･전자 결재･근태 등</text>
<text x="633.0" y="630.2" font-size="12" font-weight="400" fill="#868e96" text-anchor="start" letter-spacing="-0.24">주요 기능 사용이 활성화되어 이탈률 (Churn) 방어 효과 확보.</text>
<text x="1065.0" y="612.2" font-size="12" font-weight="400" fill="#868e96" text-anchor="start" letter-spacing="-0.24">고객이 동일 기능을 반복 사용하며 습관화･내재화가 진행됨.</text>
<text x="1065.0" y="630.2" font-size="12" font-weight="400" fill="#868e96" text-anchor="start" letter-spacing="-0.24">이는 도입 성공도와 LTV 상승의 선행 지표.</text>
<text x="1498.0" y="612.2" font-size="12" font-weight="400" fill="#868e96" text-anchor="start" letter-spacing="-0.24">기능 도입 후 업무 효율 향상을 체감한 긍정 응답 비율 증가.</text>
<text x="1498.0" y="630.2" font-size="12" font-weight="400" fill="#868e96" text-anchor="start" letter-spacing="-0.24">만족도･브랜드 신뢰도 향상으로 신규 전환 및 업셀 가능성 확대.</text>
