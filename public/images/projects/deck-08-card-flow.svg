<text x="372.0" y="532.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">법인카드 등록 유형 종류</text>
<text x="372.0" y="548.2" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">무기명 (개벌지급) 법인카드</text>
<text x="372.0" y="566.2" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">무기명 (부서지급) 법인카드</text>
<text x="372.0" y="584.2" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">기명 법인카드</text>
<text x="372.0" y="602.2" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">개인형 법인카드</text>
<text x="372.0" y="647.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">법인카드 담당자 지정</text>
<text x="694.0" y="538.4" font-size="14" font-weight="400" fill="#212529" text-anchor="start">법인카드 지급 시 사용일자 asign</text>
<text x="694.0" y="555.4" font-size="14" font-weight="400" fill="#212529" text-anchor="start">유효시작일시, 유효종료일시</text>
<text x="694.0" y="572.4" font-size="14" font-weight="400" fill="#212529" text-anchor="start">지급 내역 로우 생성, 사용일자 중복 불가</text>
<text x="694.0" y="589.4" font-size="14" font-weight="400" fill="#212529" text-anchor="start">지급 시 정산위임 기능 설정</text>
<text x="1016.0" y="532.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">카드사 API → VAN 스크래핑 서버 → GPRO 전송</text>
<text x="1344.0" y="877.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">카드사 API로 수집되지 않는 하이패스 및 교통여비 관련 내역은</text>
<text x="1344.0" y="900.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">법인카드 정산 담당자 메뉴에서 수기로 처리</text>
<text x="1344.0" y="923.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">해당 메뉴에서 외화내역 보정도 함께 처리</text>
<text x="1454.0" y="534.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">N</text>
<text x="1552.0" y="479.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">Y</text>
<text x="1672.0" y="532.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">개인업무 메뉴 → 법인카드 정산</text>
<text x="1672.0" y="555.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">메뉴에서 프로젝트, 비용내역 입력 후</text>
<text x="1672.0" y="578.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">정산 신청서 상신</text>
<text x="1672.0" y="601.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">​</text>
<text x="1672.0" y="624.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">재무 → 법인카드 정산 메뉴에 결재</text>
<text x="1672.0" y="647.8" font-size="15" font-weight="700" fill="#adb5bd" text-anchor="start" letter-spacing="-0.6">완료된 법인카드 정산서 리스트 노출</text>
