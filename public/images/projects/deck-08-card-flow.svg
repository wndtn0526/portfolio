<text x="82.0" y="913.3" font-size="18" font-weight="400" fill="#495057" text-anchor="start" letter-spacing="-0.18">💡 이 과정을 통해 구성원은명확한 사용 기간 내에서 안전하게 카드 사용 및 정산을 진행할 수 있고,</text>
<text x="82.0" y="935.3" font-size="18" font-weight="400" fill="#495057" text-anchor="start" letter-spacing="-0.18">관리자는불필요한 확인·수정 업무 없이 정확하고 투명한 데이터 흐름을 확보할 수 있습니다.</text>
