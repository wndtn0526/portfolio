<text x="412" y="92" font-size="13" font-weight="700" fill="#212529" fill-opacity="1" text-anchor="middle">평균 98%</text>
<text x="600" y="92" font-size="22" font-weight="700" fill="#504fed" fill-opacity="1" text-anchor="end">+15%p</text>
