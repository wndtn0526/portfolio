<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 632" width="896" height="632" font-family="Pretendard Variable, Pretendard, -apple-system, BlinkMacSystemFont, sans-serif" aria-hidden="true">
<rect x="0" y="0" width="176" height="72" rx="8" fill="#504fed" stroke="#504fed" stroke-width="1"/>
<text x="88.0" y="41.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Admin 에서 기능 활성화</text>
<path d="M176 36.0 H214" fill="none" stroke="#504fed" stroke-width="1.5"/>
<polygon points="207,31.0 216,36.0 207,41.0" fill="#504fed"/>
<rect x="216" y="0" width="176" height="72" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
<text x="304.0" y="41.0" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">카드 등록</text>
<path d="M392 36.0 H430" fill="none" stroke="#504fed" stroke-width="1.5"/>
<polygon points="423,31.0 432,36.0 423,41.0" fill="#504fed"/>
<rect x="432" y="0" width="176" height="72" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
<text x="520.0" y="41.0" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">카드 지급</text>
<path d="M608 36.0 H646" fill="none" stroke="#504fed" stroke-width="1.5"/>
<polygon points="639,31.0 648,36.0 639,41.0" fill="#504fed"/>
<rect x="648" y="0" width="176" height="72" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
<text x="736.0" y="41.0" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">내역 스크래핑</text>
<text x="0" y="100" font-size="12" font-weight="400" fill="#495057" text-anchor="start">Admin 에서 콘솔로 기능 ON/OFF</text>
<text x="0" y="118" font-size="12" font-weight="400" fill="#495057" text-anchor="start">재무 → 법인카드 계정등록 메뉴에서</text>
<text x="0" y="136" font-size="12" font-weight="400" fill="#495057" text-anchor="start">카드사 계정 등록 및 연동 진행</text>
<text x="216" y="100" font-size="12" font-weight="400" fill="#495057" text-anchor="start">법인카드 등록 유형</text>
<text x="216" y="118" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 무기명 (개별지급) 법인카드</text>
<text x="216" y="136" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 무기명 (부서지급) 법인카드</text>
<text x="216" y="154" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 기명 법인카드</text>
<text x="216" y="172" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 개인형 법인카드</text>
<text x="216" y="190" font-size="12" font-weight="400" fill="#495057" text-anchor="start">법인카드 담당자 지정</text>
<text x="432" y="100" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 지급 시 사용일자 지정</text>
<text x="432" y="118" font-size="12" font-weight="400" fill="#495057" text-anchor="start">  (유효 시작 · 종료일시)</text>
<text x="432" y="136" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 지급 내역 로우 생성,</text>
<text x="432" y="154" font-size="12" font-weight="400" fill="#495057" text-anchor="start">  사용일자 중복 불가</text>
<text x="432" y="172" font-size="12" font-weight="400" fill="#495057" text-anchor="start">· 지급 시 정산 위임 설정</text>
<text x="676" y="100" font-size="12" font-weight="400" fill="#495057" text-anchor="start">카드사 API →</text>
<text x="676" y="118" font-size="12" font-weight="400" fill="#495057" text-anchor="start">VAN 스크래핑 서버 →</text>
<text x="676" y="136" font-size="12" font-weight="400" fill="#495057" text-anchor="start">GPRO 전송</text>
<path d="M660 72 V240 H736.0 V263" fill="none" stroke="#504fed" stroke-width="1.5"/>
<polygon points="731.0,256 736.0,265 741.0,256" fill="#504fed"/>
<polygon points="648.0,310 736.0,265 824.0,310 736.0,355" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
<text x="736.0" y="307" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">스크래핑 가능한</text>
<text x="736.0" y="324" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">데이터인가?</text>
<rect x="0" y="274.0" width="176" height="72" rx="8" fill="#504fed" stroke="#504fed" stroke-width="1"/>
<text x="88.0" y="315.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">정산 신청 및 결재</text>
<path d="M648.0 310 H178" fill="none" stroke="#504fed" stroke-width="1.5"/>
<polygon points="185,305 176,310 185,315" fill="#504fed"/>
<text x="642.0" y="302" font-size="12" font-weight="600" fill="#868e96" text-anchor="end">Y</text>
<text x="0" y="374.0" font-size="12" font-weight="400" fill="#495057" text-anchor="start">개인업무 메뉴의 법인카드 정산에서 프로젝트, 비용내역을 입력해 정산 신청서 상신</text>
<text x="0" y="392.0" font-size="12" font-weight="400" fill="#495057" text-anchor="start">결재가 끝난 정산서는 재무 메뉴의 법인카드 정산 목록에 노출</text>
<rect x="648" y="430" width="176" height="72" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
<text x="736.0" y="471.0" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">담당자 내역 수기 생성</text>
<path d="M736.0 355 V428" fill="none" stroke="#504fed" stroke-width="1.5"/>
<polygon points="731.0,421 736.0,430 741.0,421" fill="#504fed"/>
<text x="744.0" y="377" font-size="12" font-weight="600" fill="#868e96" text-anchor="start">N</text>
<path d="M648 466.0 H628 V310" fill="none" stroke="#504fed" stroke-width="1.5"/>
<circle cx="628" cy="310" r="3.5" fill="#504fed"/>
<text x="648" y="530" font-size="12" font-weight="400" fill="#495057" text-anchor="start">카드사 API 로 수집되지 않는</text>
<text x="648" y="548" font-size="12" font-weight="400" fill="#495057" text-anchor="start">하이패스, 교통비 내역은 담당자</text>
<text x="648" y="566" font-size="12" font-weight="400" fill="#495057" text-anchor="start">메뉴에서 수기로 처리</text>
<text x="648" y="584" font-size="12" font-weight="400" fill="#495057" text-anchor="start">외화 내역 환율 보정도 함께 처리</text>
<rect x="0" y="430" width="608" height="96" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
<text x="24" y="464" font-size="13" font-weight="500" fill="#212529" text-anchor="start">이 과정을 통해 구성원은 명확한 사용 기간 안에서 안전하게 카드를 쓰고 정산할 수 있고,</text>
<text x="24" y="486" font-size="13" font-weight="500" fill="#212529" text-anchor="start">관리자는 불필요한 확인 · 수정 업무 없이 정확하고 투명한 데이터 흐름을 확보할 수 있습니다.</text>
</svg>
